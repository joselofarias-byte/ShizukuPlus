name: Automation APK Build

on:
  push:
    branches:
      - 'automation/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shizukuplus-debug-${{ github.sha }}
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
